# The test suite and both typechecks, on every push and every pull request.
#
# The typechecks run as two steps rather than one because they check two
# different things under two different sets of compiler options: `typecheck`
# covers `src/`, the machinery that copies files, and `typecheck:templates`
# covers `templates/`, the game that gets copied. The second is the one that
# guards what a developer actually runs, and it did not exist until #56 —
# `templates/` was outside every program in the repository, so a file
# referencing five undefined functions passed the build.
#
# They run before the suite because they are seconds against its minutes, and a
# template that does not compile has nothing to say to a test that stands it up.
#
# The suite stands the generated project up and runs it against an in-memory
# chain, so it is minutes rather than seconds and needs no network.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be checked without opening a pull request for it, and so a
  # run that failed for a reason outside the commit — a bad SDK release, a runner
  # hiccup — can be repeated without an empty push.
  workflow_dispatch:

# A second push to a branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No lockfile is committed, so this resolves the declared ranges. That is
      # the point for this package: it is a scaffolder shipped alongside a moving
      # SDK, and it should fail here when the SDK it emits code against changes
      # under it rather than in somebody's new project.
      - run: bun install

      - run: bun run typecheck

      - run: bun run typecheck:templates

      - run: bun test
