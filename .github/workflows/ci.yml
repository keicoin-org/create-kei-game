# The test suite and the typecheck, on every push and every pull request.
#
# Two jobs rather than two steps, because they fail for unrelated reasons and
# each is worth seeing even when the other is red. `typecheck` is the shorter
# of the two and usually answers first.
#
# The suite stands the generated project up and runs it against an in-memory
# chain, so it is minutes rather than seconds and needs no network.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a branch can be checked without opening a pull request for it, and so a
  # run that failed for a reason outside the commit — a bad SDK release, a runner
  # hiccup — can be repeated without an empty push.
  workflow_dispatch:

# A second push to a branch makes the first run irrelevant — but a second merge
# into `main` does not make the first one irrelevant, it makes it unverified.
# `github.ref` is `refs/heads/main` for every merge, so a plain ref-keyed group
# made each merge cancel the one before it. Keying the group by the commit on
# `main` gives each merge its own; `cancel-in-progress: false` alone would not,
# because a group holds at most one pending run and a third merge would cancel
# the second. See keicoin-org/kei-node#64.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No lockfile is committed, so this resolves the declared ranges. That is
      # the point for this package: it is a scaffolder shipped alongside a moving
      # SDK, and it should fail here when the SDK it emits code against changes
      # under it rather than in somebody's new project.
      - run: bun install

      - run: bun test

  # Three programs: this package, the suite, and — the one that did not exist
  # until #56 — the game the package emits. `templates/` is what a developer
  # runs, so a type error in it is a type error in the product, and it was
  # invisible for as long as `tsconfig.json` said `"include": ["src"]`.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun run typecheck
