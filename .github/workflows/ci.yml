name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Fresh process: generated-project installs, builds, and servers must not
      # inherit the unit suite's memory on constrained Windows runners.
      - run: bun run test:generated
      - run: bun run build
